# Throwaway WordPress benches for the image delivery checks (AVIF negotiation).
# Driven by run.sh, one compose project per stack (-p lumia-img-<stack>, --profile <stack>),
# so the three stacks are independent and can run side by side. Never shipped
# (tools/ is excluded from the release zip).
#
#   nginx  : the Dokploy template's nginx.conf (rendered) + wordpress:7-php8.5-fpm-alpine
#            + the template's `cron` container (wordpress:cli-2-php8.5)   -> http://localhost:8091
#   apache : wordpress:php8.5-apache (mod_php, .htaccess)                -> http://localhost:8092
#   ols    : OpenLiteSpeed + lsphp 8.5 (.htaccess via its rewrite engine) -> http://localhost:8093
#
# Each stack gets a "loopback" sidecar (alpine/socat sharing the PHP container's network
# namespace): inside the container, http://localhost:<port> reaches the web server, exactly
# like a production container reaching itself through its public domain. The plugin's
# delivery self-test needs that.

x-db-env: &db-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress

# Subset of the template's WORDPRESS_CONFIG_EXTRA that matters here (no Redis).
x-config-extra: &config-extra
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_DEBUG_LOG', true);
    define('WP_DEBUG_DISPLAY', false);
    define('WP_MEMORY_LIMIT', '256M');
    define('WP_MAX_MEMORY_LIMIT', '512M');
    define('FS_METHOD', 'direct');
    define('DISABLE_WP_CRON', ${E2E_DISABLE_WP_CRON:-true});

x-healthy-db: &healthy-db
  db:
    condition: service_healthy

services:
  db:
    image: mariadb:12
    profiles: [nginx, apache, ols]
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40

  # ---------------------------------------------------------------- nginx
  # The `wordpress` network alias is what the template's nginx.conf expects
  # (set $upstream_php wordpress:9000).
  wp-nginx:
    image: wordpress:7-php8.5-fpm-alpine
    profiles: [nginx]
    depends_on: *healthy-db
    networks:
      default:
        aliases: [wordpress]
    environment:
      <<: [*db-env, *config-extra]
      WORDPRESS_DEBUG: "1"
      # Alpine: POSIX form, as in the template.
      TZ: CET-1CEST,M3.5.0,M10.5.0/3
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 3s
      timeout: 5s
      retries: 40
    volumes:
      - wp_data:/var/www/html
      - ${RENDERED_DIR:-./out/nginx-rendered}/files/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ${RENDERED_DIR:-./out/nginx-rendered}/files/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ${RENDERED_DIR:-./out/nginx-rendered}/files/php/fpm-performance.conf:/usr/local/etc/php-fpm.d/zz-performance.conf:ro
      - ../e2e/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./:/bench:ro
      - ./out:/bench/out
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2.0"

  # init.sh's job in the template: write the three nginx snippets into the webroot (nginx.conf
  # includes them). One-shot, after WordPress has been copied into the volume.
  snippets-nginx:
    image: nginx:1-alpine
    profiles: [nginx]
    depends_on:
      wp-nginx:
        condition: service_healthy
    entrypoint: ["sh", "-c", "cp /snippets/*.conf /var/www/html/ && chmod 644 /var/www/html/nginx-*.conf"]
    restart: "no"
    volumes:
      - wp_data:/var/www/html
      - ./nginx:/snippets:ro

  web-nginx:
    image: nginx:1-alpine
    profiles: [nginx]
    depends_on:
      snippets-nginx:
        condition: service_completed_successfully
    ports:
      - "8091:80"
    volumes:
      - wp_data:/var/www/html:ro
      - ${RENDERED_DIR:-./out/nginx-rendered}/files/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${RENDERED_DIR:-./out/nginx-rendered}/files/nginx/maintenance.html:/usr/share/nginx/maintenance/maintenance.html:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 3s
      timeout: 5s
      retries: 40
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: "0.5"

  loopback-nginx:
    image: alpine/socat
    profiles: [nginx]
    network_mode: "service:wp-nginx"
    depends_on:
      - web-nginx
    command: ["TCP-LISTEN:8091,fork,reuseaddr", "TCP:web-nginx:80"]
    restart: unless-stopped

  # The template's cron container: same image, same volume, WP-CLI as www-data (82).
  # Kept idle; run.sh `wp-cron nginx <args>` runs commands in it. The bench uses it to
  # prove that nothing is encoded in the CLI image (spec 9.1).
  cron-nginx:
    image: wordpress:cli-2-php8.5
    profiles: [nginx]
    depends_on: *healthy-db
    entrypoint: ["sleep", "infinity"]
    working_dir: /var/www/html
    environment:
      <<: [*db-env, *config-extra]
      HOME: /tmp
      WORDPRESS_DEBUG: "1"
      TZ: CET-1CEST,M3.5.0,M10.5.0/3
    volumes:
      - wp_data:/var/www/html
      - ../e2e/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./:/bench:ro
      - ./out:/bench/out
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # --------------------------------------------------------------- apache
  # mod_headers is NOT enabled in the official image: enabled here (E2E_APACHE_MODS), and
  # switchable with `run.sh apache-mod apache headers off` for the "no mod_headers" scenario.
  wp-apache:
    image: wordpress:php8.5-apache
    profiles: [apache]
    depends_on: *healthy-db
    ports:
      - "8092:80"
    environment:
      <<: [*db-env, *config-extra]
      WORDPRESS_DEBUG: "1"
    entrypoint:
      - sh
      - -c
      - |
        a2enmod headers >/dev/null
        exec docker-entrypoint.sh "$$@"
      - --
    command: ["apache2-foreground"]
    volumes:
      - wp_data:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/zz-bench.ini:ro
      - ../e2e/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./:/bench:ro
      - ./out:/bench/out
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2.0"

  loopback-apache:
    image: alpine/socat
    profiles: [apache]
    network_mode: "service:wp-apache"
    command: ["TCP-LISTEN:8092,fork,reuseaddr", "TCP:127.0.0.1:80"]
    restart: unless-stopped

  # ------------------------------------------------------------------ ols
  # OpenLiteSpeed (the open-source LiteSpeed). The vhost is replaced by ols/vhconf.conf
  # (rewrite + .htaccess loading on), WordPress is installed into the Example vhost root.
  ols:
    image: litespeedtech/openlitespeed:1.9.3-lsphp85
    profiles: [ols]
    depends_on: *healthy-db
    ports:
      - "8093:8088"
    entrypoint: ["/bin/bash", "/bench/ols/entrypoint.sh"]
    volumes:
      - wp_data:/usr/local/lsws/Example/html
      - ../e2e/mu-plugins:/usr/local/lsws/Example/html/wp-content/mu-plugins:ro
      - ./:/bench:ro
      - ./out:/bench/out
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2.0"

  loopback-ols:
    image: alpine/socat
    profiles: [ols]
    network_mode: "service:ols"
    command: ["TCP-LISTEN:8093,fork,reuseaddr", "TCP:127.0.0.1:8088"]
    restart: unless-stopped

volumes:
  wp_data:
  db_data:
