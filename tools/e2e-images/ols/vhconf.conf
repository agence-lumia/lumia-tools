# Bench vhost for the OpenLiteSpeed stack: the stock "Example" vhost with rewrite rules and
# per-directory .htaccess loading switched on (the plugin writes uploads/.htaccess).
docRoot                   $VH_ROOT/html/
enableGzip                1

index  {
  useServer               0
  indexFiles              index.php, index.html
}

errorlog $VH_ROOT/logs/error.log {
  useServer               1
  logLevel                DEBUG
  rollingSize             10M
}

accessLog $VH_ROOT/logs/access.log {
  useServer               0
  rollingSize             10M
  keepDays                30
}

context / {
  allowBrowse             1
  location                $DOC_ROOT/
  rewrite  {
    RewriteFile           .htaccess
  }
}

rewrite  {
  enable                  1
  autoLoadHtaccess        1
  logLevel                0
}

accessControl  {
  allow                   *
}

general  {
  enableContextAC         0
}

