name: Release Dev Pre-release

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: lumia-release-dev
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      # Build tools (tools/build/build-zip.sh): PHP runs WP-CLI for the .l10n.php files,
      # Node runs the pinned esbuild. Set up first: a setup failure stops the run before
      # the version commit and the tag are pushed.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Fetch full tag history
        run: git fetch --tags --force

      - name: Determine dev release version
        id: version
        run: |
          set -euo pipefail

          file_version=$(grep -Eo "define[[:space:]]*\([[:space:]]*'LUMIA_VERSION'[[:space:]]*,[[:space:]]*'[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?'" lumia-tools.php | sed -E "s/.*'([0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?)'/\1/")
          if [[ -z "$file_version" ]]; then
            echo "Unable to detect plugin version"
            exit 1
          fi

          # Strip any suffix to get the base semver (e.g. 1.0.2-dev.4 -> 1.0.2)
          file_base_version=$(echo "$file_version" | sed -E 's/-[a-z].*//')

          # Pre-releases target the next patch (1.1.0 -> 1.1.1-dev.N): in SemVer and
          # version_compare(), 1.1.0-dev.N is OLDER than 1.1.0, not newer.
          latest_stable_tag=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [[ -n "$latest_stable_tag" ]]; then
            IFS='.' read -r major minor patch <<< "${latest_stable_tag#v}"
            base_version="${major}.${minor}.$((patch + 1))"
          else
            base_version="$file_base_version"
          fi

          latest_dev_tag=$(git tag -l "v${base_version}-dev.*" | grep -E "^v${base_version}-dev\.[0-9]+$" | sort -V | tail -n1 || true)
          if [[ -z "$latest_dev_tag" ]]; then
            dev_build=1
          else
            dev_build=${latest_dev_tag##*.}
            dev_build=$((dev_build + 1))
          fi

          target_version="${base_version}-dev.${dev_build}"
          target_tag="v${target_version}"

          echo "Base version: $base_version"
          echo "Latest dev tag: ${latest_dev_tag:-none}"
          echo "Target version: $target_version"
          echo "Target tag: $target_tag"

          echo "version=$target_version" >> "$GITHUB_OUTPUT"
          echo "tag=$target_tag" >> "$GITHUB_OUTPUT"

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update plugin version in files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          sed -E -i "s/^ \* Version:[[:space:]]+.*/ * Version:     ${VERSION}/" lumia-tools.php
          sed -E -i "s/(define[[:space:]]*\([[:space:]]*'LUMIA_VERSION'[[:space:]]*,[[:space:]]*')[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]*)?/\1${VERSION}/" lumia-tools.php

      - name: Create and push tag
        env:
          TARGET_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if git rev-parse "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Tag ${TARGET_TAG} already exists"
            exit 1
          fi

          git add lumia-tools.php
          git commit -m "chore(release): v${VERSION}"
          git tag -a "$TARGET_TAG" -m "Dev release ${TARGET_TAG}"
          git push origin HEAD:refs/heads/dev
          git push origin "$TARGET_TAG"

      - name: Build release zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash tools/build/build-zip.sh "$VERSION" "dist/lumia-tools-${VERSION}.zip"

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/lumia-tools-${{ steps.version.outputs.version }}.zip
          prerelease: true
          generate_release_notes: true
          body: |
            Automatic dev pre-release for branch dev.

            This release is published on every push to dev so it can be tested through the WordPress updater on a production-like environment.

      - name: Delete old dev pre-releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          # Read the list first, then filter in bash: a `grep` that matches
          # nothing exits 1 and, under pipefail, failed the step on a repository
          # with no older dev pre-release (first dev release of agence-lumia/lumia-tools).
          tags=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease == true) | .tagName')

          while IFS= read -r tag; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]] || continue
            [[ "$tag" == "$NEW_TAG" ]] && continue
            echo "Deleting old dev pre-release: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done <<< "$tags"
