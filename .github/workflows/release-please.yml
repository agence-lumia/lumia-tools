name: Release Stable Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (patch, minor or major)
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: lumia-release-stable
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Fetch full tag history
        run: git fetch --tags --force

      - name: Determine release version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail

          # Use the latest stable tag as source of truth (the PHP file may contain a dev suffix)
          latest_stable_tag=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)

          if [[ -z "$latest_stable_tag" ]]; then
            echo "No stable tag found — cannot determine next version"
            exit 1
          fi

          current_version="${latest_stable_tag#v}"
          IFS='.' read -r major minor patch <<< "$current_version"
          case "$BUMP" in
            major) target_version="$((major + 1)).0.0" ;;
            minor) target_version="${major}.$((minor + 1)).0" ;;
            patch) target_version="${major}.${minor}.$((patch + 1))" ;;
            *)
              echo "Unknown bump type: $BUMP"
              exit 1
              ;;
          esac

          echo "Latest stable tag: $latest_stable_tag"
          echo "Current version: $current_version"
          echo "Bump: $BUMP"
          echo "Target version: $target_version"
          echo "version=$target_version" >> "$GITHUB_OUTPUT"

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update plugin version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          sed -E -i "s/^ \* Version:[[:space:]]+.*/ * Version:     ${VERSION}/" lumia-tools.php
          sed -E -i "s/(define[[:space:]]*\([[:space:]]*'LUMIA_VERSION'[[:space:]]*,[[:space:]]*')[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]*)?/\1${VERSION}/" lumia-tools.php

      - name: Commit release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No version changes to commit"
            exit 0
          fi

          git add lumia-tools.php
          git commit -m "chore(release): v${VERSION}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          tag="v${VERSION}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists"
            exit 1
          fi

          git tag -a "$tag" -m "Release ${tag}"
          git push origin "$tag"

      - name: Build release zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p dist/package/lumia-tools
          rsync -a ./ dist/package/lumia-tools/ \
            --exclude='/.git' \
            --exclude='/.github' \
            --exclude='/.vscode' \
            --exclude='/node_modules' \
            --exclude='/dist' \
            --exclude='/.claude' \
            --exclude='/.mcp.json' \
            --exclude='/.gitignore' \
            --exclude='/vendor' \
            --exclude='/composer.json' \
            --exclude='/composer.lock' \
            --exclude='/phpcs.xml.dist' \
            --exclude='/phpstan.neon.dist' \
            --exclude='/phpstan-baseline.neon' \
            --exclude='/phpcs.baseline.xml' \
            --exclude='/.phpcs.cache' \
            --exclude='/tools' \
            --exclude='/CLAUDE.md' \
            --exclude='/docs' \
            --exclude='/.superpowers' \
            --exclude='/.DS_Store'
          cd dist/package
          zip -r "../lumia-tools-${VERSION}.zip" lumia-tools

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: dist/lumia-tools-${{ steps.version.outputs.version }}.zip
          prerelease: false
          generate_release_notes: true
