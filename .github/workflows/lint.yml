name: Lint

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: lumia-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHPCS + PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2, cs2pr

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # PHP 8.0 compatibility is checked by PHPCompatibilityWP inside PHPCS.
      - name: PHP syntax check
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: PHPCS
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=github

  i18n:
    name: Language files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Test the language tooling
        run: sh tools/i18n/test.sh

      # The .pot is regenerated from the source, so a string added without
      # touching the .po is caught here. Output goes outside the workspace.
      - name: Regenerate the .pot
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/app:ro" -v "$RUNNER_TEMP:/out" -w /app \
            wordpress:cli-php8.3 \
            wp i18n make-pot . /out/lumia-tools.pot \
              --slug=lumia-tools --domain=lumia-tools --exclude=vendor,tools,docs,dist

      - name: Check .po against the .pot and .mo against the .po
        run: php tools/i18n/build-po.php check "$RUNNER_TEMP/lumia-tools.pot" languages/lumia-tools-fr_FR.po languages/lumia-tools-fr_FR.mo

  build:
    name: Release zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Same setup as the release workflows: the zip is built here on every PR, so a
      # broken build shows up before a release tag is pushed.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build the zip
        run: bash tools/build/build-zip.sh "0.0.0-pr" "$RUNNER_TEMP/lumia-tools.zip"
